# Spotarchive configuration.
#
# Copy this file to spotarchive.toml in the same folder (the install scripts
# do it for you) and change what you need. Every setting is optional: a
# missing setting, or a missing file, means the default shown here.
# All settings: docs/configuration.md

# Folder that holds session.json and one folder per playlist. A relative path
# is relative to the folder you run spotarchive in.
data_dir = "data"

[login]
# Browser for the Spotify login window: "chrome", "edge", "brave", "vivaldi",
# "opera" or "chromium". Empty: the first of Chrome, Edge and Playwright's
# bundled Chromium that is found.
browser = ""

[download]
# Download helper that sources the songs. Available: "somedl", "ytdlp".
backend = "somedl"
# Helper that tries the songs the first one can't download (SomeDL only
# searches YouTube Music, yt-dlp all of YouTube). Empty: no fallback.
fallback = "ytdlp"
# How many songs to download at once. 0: half of the threads your CPU runs at
# once. 1: one at a time, showing the helper's own output. Overridden by
# `spotarchive --threads N` (-t N).
threads = 0

[metadata]
# Where `spotarchive --meta` takes the songs' tags from:
#   "backend"  the download helper's own metadata (SomeDL: YouTube Music,
#              MusicBrainz, ...). Each song is tagged by the helper that
#              downloaded it, else by the other one. yt-dlp finds no metadata
#              and uses the setlist's. Falls back to "setlist" for helpers
#              that can't tag files.
#   "setlist"  Spotify's metadata from setlist.csv (title, artists, album,
#              release date).
source = "backend"

# Settings for each backend, under [backends.<name>].
[backends.somedl]
# Path to the somedl program. Empty: look next to Spotarchive's Python, then on PATH.
executable = ""
# Audio format: "mp3", "m4a", "opus", "vorbis", "flac", "best", ...
# Empty: the format from SomeDL's own config file (mp3 unless you changed it).
audio_format = ""
# true: every song directly in its playlist folder, named "Artist - Song".
# false: the output template from SomeDL's own config file (for example
# artist/album subfolders), inside the playlist folder.
flat = true
# Extra command-line options for every download, e.g. ["--sleep", "5"].
extra_args = []

[backends.ytdlp]
# Path to the yt-dlp program. Empty: look next to Spotarchive's Python, then on PATH.
executable = ""
# Audio format: "mp3", "m4a", "opus", "vorbis", "flac", "alac", "aac", "wav" or
# "best" (whatever YouTube has, not converted).
audio_format = "mp3"
# How many YouTube search results to look through for a video of the right length.
search_results = 5
# Seconds a video may be shorter or longer than the song on Spotify (music
# videos often have an intro). 0: any length.
length_tolerance = 30
# Extra command-line options for every download, e.g. ["--sleep-requests", "1"].
# yt-dlp's own config files are ignored.
extra_args = []
