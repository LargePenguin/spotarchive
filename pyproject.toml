[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotarchive"
dynamic = ["version"]
description = "Cache Spotify playlist metadata and legally source the songs through a swappable download backend"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "requests>=2.31",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spotarchive = "spotarchive.cli:main"

[project.urls]
Homepage = "https://github.com/LargePenguin/spotarchive"

[tool.setuptools.dynamic]
version = { attr = "spotarchive.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
